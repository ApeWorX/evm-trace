name: Release

on:
  release:
    types: [released]

jobs:
  deploy:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: astral-sh/setup-uv@v7

    - name: Build
      run: uv build

    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
