on: ["push", "pull_request"]

name: Test

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Run Ruff Lint
        run: uv run --only-group lint ruff check .
      - name: Run Ruff Format
        run: uv run --only-group lint ruff format --check .
      - name: Run mdformat
        run: uv run --only-group lint mdformat --check *.md tests/data/**/*.md

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Run MyPy
        run: uv run --no-default-groups --group lint --group test mypy .

  functional:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install test dependencies
        run: uv sync --no-default-groups --group test
      - name: Run Tests
        run: uv run --no-sync pytest

